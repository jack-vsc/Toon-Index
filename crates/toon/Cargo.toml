[package]
name = "toon"
description = "Toon Index: traduz capítulos de mangá e webtoon com IA, organiza a biblioteca e acompanha a leitura"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "toon-index"
path = "src/main.rs"

[dependencies]
toon-core.workspace = true
toon-ai.workspace = true
toon-page.workspace = true
toon-web.workspace = true
toon-server.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
futures.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true
parking_lot.workspace = true
async-trait = "0.1"
eframe = { version = "0.32", default-features = false, features = ["default_fonts", "glow", "persistence"] }
rfd = "0.15"
qrcode = { version = "0.14", default-features = false }
open = "5"
